name: Intake validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intake:
    name: Intake fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Python and offline intake fixtures
        run: |
          python3 --version
          python3 -m compileall -q hyperreview
          python3 -m unittest discover -s tests -v
