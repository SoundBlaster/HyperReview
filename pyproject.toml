[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperreview"
version = "0.1.0"
description = "Local architectural PR explanations using Hypercode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "specification-core @ git+https://github.com/SoundBlaster/SpycificationCore.git@582a77a7e1c7f144f5809558605fc9fc822d8787",
]

[tool.setuptools.packages.find]
include = ["hyperreview*"]
