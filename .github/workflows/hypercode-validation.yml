name: Hypercode validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hypercode-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Hypercode architecture
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout HyperReview
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout pinned Hypercode compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 0al-spec/Hypercode
          ref: 7d23efdc9976226a21e1fc301730940d62097607
          path: .toolchain/hypercode
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"

      - name: Install HyperReview with pinned policy dependency
        run: python3 -m pip install .

      - name: Record tool versions
        run: |
          swift --version
          python3 --version
          git -C .toolchain/hypercode rev-parse HEAD

      - name: Build Hypercode with locked dependencies
        working-directory: .toolchain/hypercode
        run: swift build --product hypercode --force-resolved-versions

      - name: Validate architecture profiles
        run: python3 tools/validate_architecture.py --hypercode .toolchain/hypercode/.build/debug/hypercode

      - name: Validate controlled paired projections with the real compiler
        env:
          HYPERREVIEW_TEST_COMPILER: ${{ github.workspace }}/.toolchain/hypercode/.build/debug/hypercode
        run: python3 -m unittest discover -s tests -p test_compiled_preview.py -v

      - name: Validate six controlled pilot boundaries
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from hyperreview.pilot import run_pilot
          compiler = Path('.toolchain/hypercode/.build/debug/hypercode').resolve()
          result = run_pilot(compiler, hashlib.sha256(compiler.read_bytes()).hexdigest(),
                             Path('.artifacts/pilot').resolve())
          assert result['all_expected_outcomes_matched'], 'Controlled pilot outcome mismatch'
          print('Six controlled outcomes matched; human evaluation remains unmeasured.')
          PY

      - name: Upload emitted IR and diff
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypercode-validation
          path: .artifacts/hypercode/
          if-no-files-found: ignore
          retention-days: 7
